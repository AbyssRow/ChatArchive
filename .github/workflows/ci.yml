name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-publish:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore ChatArchive.sln --nologo

      - name: Build
        run: dotnet build ChatArchive.sln -c Release -p:Platform=x64 --no-restore --nologo

      - name: Test Core
        shell: pwsh
        run: >
          pwsh -File .github/workflows/run-xunit-exe.ps1
          -SearchRoot tests/ChatArchive.Core.Tests/bin
          -ExeName ChatArchive.Core.Tests.exe
          -MinimumTests 400

      - name: Test App
        shell: pwsh
        run: >
          pwsh -File .github/workflows/run-xunit-exe.ps1
          -SearchRoot tests/ChatArchive.App.Tests/bin
          -ExeName ChatArchive.App.Tests.exe
          -MinimumTests 100

      - name: Publish probe
        run: >
          dotnet publish src/ChatArchive.App/ChatArchive.App.csproj
          -c Release -p:Platform=x64 -r win-x64 --nologo
          -p:PublishProfile=win-x64-app-local

      - name: Check published payload
        shell: pwsh
        run: |
          $dir = "artifacts/publish/win-x64"
          $required = @(
            "ChatArchive.App.exe",
            "ChatArchive.App.dll",
            "ChatArchive.App.runtimeconfig.json",
            "ChatArchive.Core.dll",
            "ChatArchive.App.pri"
          )
          foreach ($name in $required) {
            $path = Join-Path $dir $name
            if (-not (Test-Path $path)) { throw "Publish probe missing $path" }
            if ((Get-Item $path).Length -le 0) { throw "Publish probe empty $path" }
          }
          Get-Item (Join-Path $dir "ChatArchive.App.exe") |
            Select-Object FullName, Length, LastWriteTime
